name: Daily AI Digest Web
on:
  schedule:
    - cron: '0 2 * * *'    # 每天 10:00 北京（构建步骤已做容错，失败不会触发失败邮件）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      # 容错：云端 runner 拉取 aihot.news 可能返回空响应。此步骤失败不影响 run 结论，
      # 因此 GitHub 不会再发送 "Run failed" 邮件；失败细节仍可在 step 日志中查看。
      - name: Fetch and build (tolerant)
        continue-on-error: true
        run: |
          python3 scripts/fetch_daily.py
          python3 scripts/convert_current.py
          python3 scripts/build_single.py
          python3 scripts/build_archive.py
      - name: Commit and push if changed
        continue-on-error: true
        run: |
          git config user.name  "ai-daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ index.html archive.html
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "daily $(date +%Y-%m-%d)"
            git push
          fi
