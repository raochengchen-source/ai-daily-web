name: Daily AI Digest Web
on:
  schedule:
    - cron: '0 2 * * *'    # 每天 10:00 北京（单时间窗，成功后当天不再触发）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - run: python3 scripts/fetch_daily.py
      - run: python3 scripts/convert_current.py
      - run: python3 scripts/build_single.py
      - run: python3 scripts/build_archive.py
      - run: |
          git config user.name  "ai-daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ index.html archive.html
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "daily $(date +%Y-%m-%d)"
            git push
          fi
